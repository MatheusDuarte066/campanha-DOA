<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel do Mestre · D.O.A.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/estilo.css">
</head>
<body>
<div class="wrap">
  <header class="capa">
    <div class="capa-topo">
      <span class="sigla">D.O.A. · Divisão de Ocorrências Atípicas</span>
      <span class="selo" aria-hidden="true">Uso restrito</span>
    </div>
    <h1>Painel do Mestre</h1>
    <p class="lede">Todas as fichas enviadas pelos jogadores, com a parte secreta incluída.</p>
    <p class="nota">Material de jogo · campanha de RPG</p>
  </header>

  <form class="entrada" id="entrada" autocomplete="off">
    <h2>Acesso do mestre</h2>
    <p>A senha é conferida pela planilha, não por esta página.</p>
    <label class="rotulo" for="senha">Senha</label>
    <input type="password" id="senha" autocomplete="current-password" required>
    <p class="erro" id="erro" hidden></p>
    <div><button type="submit" class="btn primario" id="btn-entrar">Entrar</button></div>
  </form>

  <section id="painel" hidden>
    <div class="ferramentas">
      <input type="search" id="busca" placeholder="Buscar por personagem, jogador ou poder" aria-label="Buscar fichas">
      <button type="button" class="btn" id="btn-atualizar">Atualizar</button>
      <button type="button" class="btn discreto" id="btn-sair">Sair</button>
    </div>
    <p class="contagem" id="contagem"></p>
    <div class="lista" id="lista"></div>
  </section>
</div>

<div id="aviso" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" async></script>
<script src="assets/ficha.js"></script>
<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const D = window.DOA;
  const CHAVE_SESSAO = 'doa-mestre-senha';
  let senha = '';
  let fichas = [];

  const MENSAGENS = {
    'senha': 'Senha errada.',
    'bloqueado': 'Muitas tentativas erradas. Espere 10 minutos e tente de novo.',
    'sem-senha': 'A senha ainda não foi definida. Troque SENHA_MESTRE no código do Apps Script e crie uma nova implantação.',
    'sem-url': 'O site ainda não sabe onde está a planilha. Coloque o link do Apps Script em assets/ficha.js.',
    'rede': 'Não deu para falar com a planilha. Confira a internet e o link do Apps Script.',
    'resposta': 'A planilha respondeu de um jeito inesperado. Confira se a implantação está como "Qualquer pessoa".'
  };
  function mensagem(e){ return MENSAGENS[e && e.codigo] || 'Algo deu errado ao carregar as fichas. Tente de novo.'; }

  function guardarSenha(s){ try { if (s) sessionStorage.setItem(CHAVE_SESSAO, s); else sessionStorage.removeItem(CHAVE_SESSAO); } catch (e) {} }
  function senhaGuardada(){ try { return sessionStorage.getItem(CHAVE_SESSAO) || ''; } catch (e) { return ''; } }

  async function carregar(s){
    const r = await D.chamarScript({acao:'listar', senha: s});
    fichas = Array.isArray(r.fichas) ? r.fichas : [];
    render();
  }

  function cartao(it){
    const v = it.campos || {};
    const art = document.createElement('article'); art.className = 'recebida';
    const cab = document.createElement('div'); cab.className = 'rec-cab';
    const h = document.createElement('h3'); h.textContent = String(v.personagem || '').trim() || 'Personagem sem nome';
    cab.appendChild(h);
    if (v.tipo){
      const pl = document.createElement('span');
      pl.className = 'pill ' + (v.tipo === 'Dívida' ? 'divida' : 'tributo');
      pl.textContent = v.tipo + (v.poder ? ' · ' + v.poder : '');
      cab.appendChild(pl);
    }
    art.appendChild(cab);
    const meta = document.createElement('p'); meta.className = 'rec-meta';
    meta.textContent = 'Jogador: ' + (String(v.jogador || '').trim() || 'sem nome') + ' · ' + (it.protocolo || '') + ' · atualizada em ' + D.dataCurta(it.atualizadaEm);
    art.appendChild(meta);
    const det = document.createElement('details');
    const sm = document.createElement('summary'); sm.textContent = 'Ver ficha completa'; det.appendChild(sm);
    const dl = document.createElement('dl');
    D.FIELDS.forEach(f => {
      const val = String(v[f.id] || '').trim(); if (!val) return;
      const dt = document.createElement('dt'); dt.textContent = f.label;
      const dd = document.createElement('dd'); dd.textContent = val;
      if (f.id === 'segredo') dd.className = 'secreto';
      dl.append(dt, dd);
    });
    det.appendChild(dl); art.appendChild(det);
    const ac = document.createElement('div'); ac.className = 'rec-acoes';
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = 'Baixar PDF';
    b.addEventListener('click', () => {
      const arq = D.arquivoDaFicha(v, it.protocolo);
      D.baixarBlob(arq.nome, arq.blob);
      D.aviso(arq.tipo === 'application/pdf' ? 'PDF baixado.' : 'O gerador de PDF não carregou, então baixei em texto.');
    });
    const c = document.createElement('button'); c.type = 'button'; c.className = 'btn'; c.textContent = 'Copiar texto';
    c.addEventListener('click', () => D.copiar(D.fichaTexto(v, it.protocolo, false), c));
    ac.append(b, c); art.appendChild(ac);
    return art;
  }

  function render(){
    const termo = $('#busca').value.trim().toLowerCase();
    const visiveis = fichas.filter(it => {
      if (!termo) return true;
      const v = it.campos || {};
      return [v.personagem, v.jogador, v.poder, v.tipo, it.protocolo].some(x => String(x || '').toLowerCase().includes(termo));
    });
    const total = fichas.length;
    $('#contagem').textContent = total === 0 ? '' :
      (termo ? visiveis.length + ' de ' + total + ' fichas' : total + (total === 1 ? ' ficha recebida' : ' fichas recebidas'));
    const lista = $('#lista');
    if (!total){
      const vz = document.createElement('div'); vz.className = 'vazio';
      vz.textContent = 'Nenhuma ficha enviada ainda. Quando um jogador tocar em "Enviar ao mestre" na ficha, ela aparece aqui.';
      lista.replaceChildren(vz); return;
    }
    if (!visiveis.length){
      const vz = document.createElement('div'); vz.className = 'vazio';
      vz.textContent = 'Nenhuma ficha encontrada para essa busca.';
      lista.replaceChildren(vz); return;
    }
    lista.replaceChildren(...visiveis.map(cartao));
  }

  function mostrarPainel(on){
    $('#entrada').hidden = on; $('#painel').hidden = !on;
  }

  $('#entrada').addEventListener('submit', async e => {
    e.preventDefault();
    const s = $('#senha').value;
    if (!s) return;
    const btn = $('#btn-entrar'); btn.disabled = true; btn.textContent = 'Conferindo…';
    $('#erro').hidden = true;
    try {
      await carregar(s);
      senha = s; guardarSenha(s); $('#senha').value = '';
      mostrarPainel(true);
    } catch (err) {
      const p = $('#erro'); p.textContent = mensagem(err); p.hidden = false;
    } finally {
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  });
  $('#busca').addEventListener('input', render);
  $('#btn-atualizar').addEventListener('click', async () => {
    const btn = $('#btn-atualizar'); btn.disabled = true; btn.textContent = 'Atualizando…';
    try { await carregar(senha); D.aviso('Fichas atualizadas.'); }
    catch (err) { D.aviso(mensagem(err)); if (err && (err.codigo === 'senha' || err.codigo === 'bloqueado')) sair(); }
    finally { btn.disabled = false; btn.textContent = 'Atualizar'; }
  });
  function sair(){ senha = ''; fichas = []; guardarSenha(''); $('#lista').replaceChildren(); mostrarPainel(false); $('#senha').focus(); }
  $('#btn-sair').addEventListener('click', sair);

  const guardada = senhaGuardada();
  if (guardada){
    carregar(guardada).then(() => { senha = guardada; mostrarPainel(true); }).catch(() => guardarSenha(''));
  }
})();
</script>
</body>
</html>
